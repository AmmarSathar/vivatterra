<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vivaTTerra — Where producers steward the land, consumers sustain it.</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="marketing.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/Header.jsx"></script>
  <script type="text/babel" src="components/Hero.jsx"></script>
  <script type="text/babel" src="components/Principles.jsx"></script>
  <script type="text/babel" src="components/Story.jsx"></script>
  <script type="text/babel" src="components/Product.jsx"></script>
  <script type="text/babel" src="components/TheoryOfChange.jsx"></script>
  <script type="text/babel" src="components/Newsletter.jsx"></script>
  <script type="text/babel" src="components/Footer.jsx"></script>

  <script type="text/babel">
    function App() {
      const [active, setActive] = React.useState('model');

      const scrollTo = (id) => {
        setActive(id);
        const target = document.getElementById(id === 'home' ? 'top' : id);
        if (!target) return;
        const top = target.getBoundingClientRect().top + window.scrollY - 72;
        window.scrollTo({ top, behavior: 'smooth' });
      };

      // Update active item based on scroll
      React.useEffect(() => {
        const sectionIds = ['model', 'producers', 'products', 'journal', 'about'];
        const onScroll = () => {
          for (let i = sectionIds.length - 1; i >= 0; i--) {
            const el = document.getElementById(sectionIds[i]);
            if (el && el.getBoundingClientRect().top < 140) {
              setActive(sectionIds[i]);
              return;
            }
          }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <>
          <div id="top"></div>
          <Header active={active} onNav={scrollTo} />
          <Hero
            onPrimary={() => scrollTo('theory')}
            onSecondary={() => scrollTo('producers')}
          />
          <Principles />
          <Story />
          <Product onBuy={() => scrollTo('journal')} />
          <TheoryOfChange />
          <Newsletter />
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
