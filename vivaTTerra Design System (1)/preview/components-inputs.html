<!doctype html><html><head><meta charset="utf-8"><title>Form Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { font-size: 11px; font-weight: 700; color: var(--vt-stone-700); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; display: block; }
  .input, .select, .textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); background: var(--vt-bone); border-radius: 8px; font-family: var(--font-sans); font-size: 14px; color: var(--vt-ink-900); box-sizing: border-box; }
  .input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--vt-clay); outline-offset: 2px; border-color: var(--vt-forest); }
  .check { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--vt-ink-900); }
  .check input { accent-color: var(--vt-forest); width: 16px; height: 16px; }
  .helper { font-size: 11px; color: var(--fg-3); margin-top: 6px; }
</style></head>
<body>
  <div class="card-eyebrow">Form inputs · warm sunken surface, clay focus ring</div>
  <div class="grid">
    <div>
      <label>Email</label>
      <input class="input" type="email" placeholder="you@cooperative.org" value="marta@carmen-pecha.bo">
      <div class="helper">We'll only send 3–4 updates per year.</div>
    </div>
    <div>
      <label>Region</label>
      <select class="select"><option>Tacana 1 — Bolivia</option><option>Madidi — Bolivia</option></select>
    </div>
    <div style="grid-column: 1 / -1">
      <label>Note</label>
      <textarea class="textarea" rows="2" placeholder="Tell us about your operation"></textarea>
    </div>
    <div class="check" style="grid-column: 1 / -1">
      <input type="checkbox" checked id="c">
      <label for="c" style="text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--vt-ink-900); font-weight: 400; margin: 0;">I'd like to receive the producer-network newsletter</label>
    </div>
  </div>
</body></html>
