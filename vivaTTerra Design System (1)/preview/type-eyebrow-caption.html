<!doctype html><html><head><meta charset="utf-8"><title>Eyebrow & Caption</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 26px 32px; }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .group { display: flex; align-items: baseline; gap: 16px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; min-width: 90px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--vt-forest); }
  .small { font-size: 12px; color: var(--vt-stone-500); letter-spacing: 0.02em; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--vt-sage-100); color: var(--vt-forest-700); letter-spacing: 0.02em; }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--vt-forest); }
</style></head>
<body>
  <div class="card-eyebrow">Supporting type · eyebrow, caption, micro-badge</div>
  <div class="stack">
    <div class="group"><span class="meta">eyebrow</span><span class="eyebrow">Theory of change</span></div>
    <div class="group"><span class="meta">caption</span><span class="small">Tacana 1, Bolivia · Carmen Pecha cooperative · 2024 harvest</span></div>
    <div class="group"><span class="meta">badge</span><span class="badge">Agroforestry-sourced</span></div>
  </div>
</body></html>
