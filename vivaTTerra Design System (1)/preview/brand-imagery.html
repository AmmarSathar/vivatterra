<!doctype html><html><head><meta charset="utf-8"><title>Image treatment</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .photo { aspect-ratio: 4 / 5; border-radius: 4px; position: relative; overflow: hidden; }
  .canopy { background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.18), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,0.12), transparent 50%),
    linear-gradient(160deg, #3B4C33 0%, #4B6040 55%, #6B8259 100%);
  }
  .berries { background:
    radial-gradient(circle at 30% 30%, rgba(187,115,74,0.6), transparent 40%),
    radial-gradient(circle at 60% 70%, rgba(75,96,64,0.6), transparent 50%),
    linear-gradient(180deg, #2F2840 0%, #4B4361 70%, #2F2840 100%);
  }
  .hands { background:
    radial-gradient(circle at 50% 60%, #BB734A 0%, #934F2E 40%, #2F2840 100%);
  }
  .photo::after { content: 'photo placeholder'; position: absolute; bottom: 8px; left: 10px; font-family: var(--font-mono); font-size: 9px; color: rgba(242,233,214,0.7); letter-spacing: 0.04em; }
  .note { margin-top: 14px; font-size: 11px; color: var(--vt-stone-700); line-height: 1.5; max-width: 64ch; }
</style></head>
<body>
  <div class="card-eyebrow">Imagery · documentary, warm-leaning, natural light · never lifestyle stock</div>
  <div class="grid">
    <div class="photo canopy"></div>
    <div class="photo berries"></div>
    <div class="photo hands"></div>
  </div>
  <div class="note">Sharp 4:5 corners on hero / product imagery. Photography vibe: producer's hands, canopy light, harvest detail. Slightly desaturated, no high-contrast lifestyle filters.</div>
</body></html>
