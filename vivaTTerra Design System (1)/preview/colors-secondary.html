<!doctype html><html><head><meta charset="utf-8"><title>Secondary Palette</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px 28px; }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .sw { border-radius: 10px; padding: 20px 18px; height: 168px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-xs); }
  .sw .name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .sw .role { font-size: 12px; opacity: 0.82; line-height: 1.4; max-width: 22ch; }
  .sw .meta { display: flex; justify-content: space-between; font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.04em; opacity: 0.82; }
  .clay { background: var(--vt-clay); color: #fff; }
  .ink { background: var(--vt-ink); color: var(--vt-cream); }
</style></head>
<body>
  <div class="card-eyebrow">Secondary palette · used sparingly for emphasis</div>
  <div class="swatches">
    <div class="sw clay">
      <div><div class="name">Clay</div><div class="role">Warm accent — harvest, single CTA emphasis. One moment per screen.</div></div>
      <div class="meta"><span>--vt-clay</span><span>#BB734A</span></div>
    </div>
    <div class="sw ink">
      <div><div class="name">Ink</div><div class="role">Primary text on light · highest-contrast dark surfaces (footer, modals)</div></div>
      <div class="meta"><span>--vt-ink</span><span>#2F2840</span></div>
    </div>
  </div>
</body></html>
