<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 26px 28px; }
  .group { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; min-width: 88px; text-transform: uppercase; }
  .btn { font-family: 'Lato', sans-serif; font-weight: 700; font-size: 13px; line-height: 1; padding: 12px 20px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all 160ms cubic-bezier(0.22, 0.61, 0.36, 1); letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 8px; }
  .btn.primary   { background: var(--vt-forest); color: var(--vt-cream); }
  .btn.primary:hover { background: var(--vt-forest-700); }
  .btn.secondary { background: transparent; color: var(--vt-forest); border-color: var(--vt-forest); }
  .btn.secondary:hover { background: var(--vt-sage-100); }
  .btn.ghost     { background: transparent; color: var(--vt-forest); padding: 12px 12px; }
  .btn.ghost:hover { color: var(--vt-clay-700); }
  .btn.warm      { background: var(--vt-clay); color: #fff; }
  .btn.warm:hover { background: var(--vt-clay-700); }
  .btn.sm { padding: 8px 14px; font-size: 12px; }
  .btn.lg { padding: 16px 24px; font-size: 14px; }
  .arrow { font-family: var(--font-mono); font-weight: 400; }
</style></head>
<body>
  <div class="card-eyebrow">Buttons · Lato 700 · +0.02em tracking · primary · secondary · ghost · warm</div>
  <div class="group"><span class="label">Primary</span><button class="btn primary">Read the model <span class="arrow">→</span></button><button class="btn primary sm">Subscribe</button><button class="btn primary lg">Get involved</button></div>
  <div class="group"><span class="label">Secondary</span><button class="btn secondary">Our producers</button><button class="btn secondary sm">Download brief</button></div>
  <div class="group"><span class="label">Ghost</span><button class="btn ghost">Learn more <span class="arrow">→</span></button></div>
  <div class="group"><span class="label">Warm</span><button class="btn warm">Buy açaí powder</button></div>
</body></html>
