<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  .row { display: flex; align-items: center; gap: 14px; margin: 6px 0; }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); min-width: 80px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); min-width: 50px; text-align: right; }
  .bar { height: 16px; background: var(--vt-sage); border-radius: 3px; }
</style></head>
<body>
  <div class="card-eyebrow">Spacing scale · 8-pt base, named --space-N (N = step in 4s)</div>
  <div class="row"><span class="nm">--space-1</span><span class="px">4px</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="nm">--space-2</span><span class="px">8px</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="nm">--space-3</span><span class="px">12px</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="nm">--space-4</span><span class="px">16px</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="nm">--space-6</span><span class="px">24px</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="nm">--space-8</span><span class="px">32px</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="nm">--space-12</span><span class="px">48px</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="nm">--space-16</span><span class="px">64px</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="nm">--space-24</span><span class="px">96px</span><span class="bar" style="width:96px"></span></div>
  <div class="row"><span class="nm">--space-32</span><span class="px">128px</span><span class="bar" style="width:128px"></span></div>
</body></html>
