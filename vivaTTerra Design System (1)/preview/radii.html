<!doctype html><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sw { width: 72px; height: 72px; background: var(--vt-forest); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); text-align: center; }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); }
</style></head>
<body>
  <div class="card-eyebrow">Corner radii · restrained; sharp edges for editorial blocks</div>
  <div class="grid">
    <div class="item"><div class="sw" style="border-radius:0"></div><div class="nm">none</div><div class="px">0</div></div>
    <div class="item"><div class="sw" style="border-radius:2px"></div><div class="nm">r-xs</div><div class="px">2px</div></div>
    <div class="item"><div class="sw" style="border-radius:4px"></div><div class="nm">r-sm</div><div class="px">4px</div></div>
    <div class="item"><div class="sw" style="border-radius:8px"></div><div class="nm">r-md</div><div class="px">8px</div></div>
    <div class="item"><div class="sw" style="border-radius:14px"></div><div class="nm">r-lg</div><div class="px">14px</div></div>
    <div class="item"><div class="sw" style="border-radius:22px"></div><div class="nm">r-xl</div><div class="px">22px</div></div>
    <div class="item"><div class="sw" style="border-radius:999px"></div><div class="nm">r-pill</div><div class="px">∞</div></div>
  </div>
</body></html>
