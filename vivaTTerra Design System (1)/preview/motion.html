<!doctype html><html><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 26px 28px; }
  .row { display: flex; align-items: center; gap: 14px; margin: 12px 0; }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); min-width: 110px; }
  .track { flex: 1; height: 8px; background: var(--vt-cream); border-radius: 4px; position: relative; overflow: hidden; }
  .dot { position: absolute; top: 50%; transform: translate(0,-50%); width: 18px; height: 18px; border-radius: 50%; background: var(--vt-clay); left: 0; }
  .label { font-size: 11px; color: var(--fg-3); min-width: 56px; text-align: right; font-family: var(--font-mono); }

  @keyframes m80  { 0%{left:0} 50%{left:calc(100% - 18px)} 100%{left:0} }
  @keyframes m160 { 0%{left:0} 50%{left:calc(100% - 18px)} 100%{left:0} }
  @keyframes m240 { 0%{left:0} 50%{left:calc(100% - 18px)} 100%{left:0} }
  @keyframes m400 { 0%{left:0} 50%{left:calc(100% - 18px)} 100%{left:0} }
  .a-instant .dot { animation: m80  1.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
  .a-fast    .dot { animation: m160 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
  .a-base    .dot { animation: m240 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
  .a-slow    .dot { animation: m400 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
  .note { margin-top: 14px; font-size: 11px; color: var(--fg-2); line-height: 1.5; }
</style></head>
<body>
  <div class="card-eyebrow">Motion · ease-out-soft (0.22, 0.61, 0.36, 1)</div>
  <div class="row"><span class="nm">--dur-instant</span><div class="track a-instant"><div class="dot"></div></div><span class="label">80ms</span></div>
  <div class="row"><span class="nm">--dur-fast</span><div class="track a-fast"><div class="dot"></div></div><span class="label">160ms</span></div>
  <div class="row"><span class="nm">--dur-base</span><div class="track a-base"><div class="dot"></div></div><span class="label">240ms</span></div>
  <div class="row"><span class="nm">--dur-slow</span><div class="track a-slow"><div class="dot"></div></div><span class="label">400ms</span></div>
  <div class="note">Things settle, they don't snap. No bouncy springs. Cross-fades + 4–8px y-translation only.</div>
</body></html>
