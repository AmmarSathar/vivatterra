<!doctype html><html><head><meta charset="utf-8"><title>Semantic Surfaces</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .sw { height: 96px; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-xs); }
  .sw .var { font-family: var(--font-mono); font-size: 10px; opacity: 0.78; }
  .sw .nm { font-size: 12px; font-weight: 700; }
  .dark { color: var(--vt-cream); }
  .light { color: var(--vt-ink-900); }
</style></head>
<body>
  <div class="card-eyebrow">Surfaces · semantic background tokens</div>
  <div class="grid">
    <div class="sw light" style="background:var(--vt-paper); border:1px solid var(--line-soft)"><span class="nm">bg</span><span class="var">--bg → paper</span></div>
    <div class="sw light" style="background:var(--vt-cream)"><span class="nm">bg-alt</span><span class="var">--bg-alt → cream</span></div>
    <div class="sw dark" style="background:var(--vt-forest)"><span class="nm">bg-deep</span><span class="var">--bg-deep → forest</span></div>
    <div class="sw dark" style="background:var(--vt-ink)"><span class="nm">bg-deeper</span><span class="var">--bg-deeper → ink</span></div>
    <div class="sw light" style="background:#fff; border:1px solid var(--line-soft)"><span class="nm">surface</span><span class="var">--surface → #fff</span></div>
    <div class="sw light" style="background:var(--vt-bone)"><span class="nm">surface-sunken</span><span class="var">--surface-sunken → bone</span></div>
  </div>
</body></html>
