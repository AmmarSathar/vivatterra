<!doctype html><html><head><meta charset="utf-8"><title>Shadows & Elevation</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px; background: var(--vt-cream); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .sw { width: 100%; height: 80px; background: #fff; border-radius: 12px; }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .xs { box-shadow: 0 1px 2px rgba(47, 40, 64, 0.06); }
  .sm { box-shadow: 0 2px 6px rgba(47, 40, 64, 0.06), 0 1px 2px rgba(47, 40, 64, 0.04); }
  .md { box-shadow: 0 8px 20px -8px rgba(47, 40, 64, 0.12), 0 2px 6px rgba(47, 40, 64, 0.06); }
  .lg { box-shadow: 0 24px 48px -16px rgba(47, 40, 64, 0.18), 0 4px 10px rgba(47, 40, 64, 0.06); }
</style></head>
<body>
  <div class="card-eyebrow">Shadows · soft, warm-aubergine tint (never neutral gray)</div>
  <div class="grid">
    <div class="item"><div class="sw xs"></div><div class="nm">--shadow-xs</div></div>
    <div class="item"><div class="sw sm"></div><div class="nm">--shadow-sm</div></div>
    <div class="item"><div class="sw md"></div><div class="nm">--shadow-md</div></div>
    <div class="item"><div class="sw lg"></div><div class="nm">--shadow-lg</div></div>
  </div>
</body></html>
