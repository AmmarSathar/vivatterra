<!doctype html><html><head><meta charset="utf-8"><title>Badges & Tags</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 26px 28px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; min-width: 90px; text-transform: uppercase; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 999px; letter-spacing: 0.02em; }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
  .b-sage { background: var(--vt-sage-100); color: var(--vt-forest-700); }
  .b-sage::before { background: var(--vt-forest); }
  .b-clay { background: var(--vt-clay-100); color: var(--vt-clay-700); }
  .b-clay::before { background: var(--vt-clay); }
  .b-stone { background: var(--vt-stone-100); color: var(--vt-stone-700); }
  .b-stone::before { background: var(--vt-stone-500); }
  .b-ink { background: var(--vt-ink); color: var(--vt-cream); }
  .b-ink::before { background: var(--vt-sage-300); }
  .tag { display: inline-flex; align-items: center; font-size: 12px; padding: 4px 10px; border-radius: 4px; background: transparent; color: var(--vt-stone-700); border: 1px solid var(--line); font-weight: 700; }
  .tag.active { background: var(--vt-forest); color: var(--vt-cream); border-color: var(--vt-forest); }
</style></head>
<body>
  <div class="card-eyebrow">Badges & filter tags</div>
  <div class="row"><span class="label">Status badges</span>
    <span class="badge b-sage">Agroforestry-sourced</span>
    <span class="badge b-clay">2024 harvest</span>
    <span class="badge b-stone">In review</span>
    <span class="badge b-ink">Limited release</span>
  </div>
  <div class="row"><span class="label">Filter tags</span>
    <span class="tag active">All</span>
    <span class="tag">Producers</span>
    <span class="tag">Products</span>
    <span class="tag">Theory of change</span>
    <span class="tag">Stories</span>
  </div>
</body></html>
