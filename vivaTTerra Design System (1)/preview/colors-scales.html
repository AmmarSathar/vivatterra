<!doctype html><html><head><meta charset="utf-8"><title>Color Scales</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 28px; }
  .row { display: grid; grid-template-columns: 92px repeat(6, 1fr); gap: 6px; align-items: center; margin-bottom: 10px; }
  .label { font-size: 12px; font-weight: 700; color: var(--fg-2); }
  .step { height: 56px; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px 8px; font-size: 9px; font-family: var(--font-mono); letter-spacing: 0.02em; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
  .dark { color: rgba(255,255,255,0.85); }
  .light { color: rgba(47,40,64,0.7); }
</style></head>
<body>
  <div class="card-eyebrow">Color scales · derived steps for each brand color</div>
  <div class="row">
    <div class="label">Forest</div>
    <div class="step dark" style="background:#2E3B27">900</div>
    <div class="step dark" style="background:#3B4C33">700</div>
    <div class="step dark" style="background:#4B6040">600</div>
    <div class="step dark" style="background:#5B7551">500</div>
    <div class="step light" style="background:#A6B89A">300</div>
    <div class="step light" style="background:#DDE5D5">100</div>
  </div>
  <div class="row">
    <div class="label">Sage</div>
    <div class="step dark" style="background:#6B8259">700</div>
    <div class="step dark" style="background:#8CA47A">500</div>
    <div class="step light" style="background:#B6C7A8">300</div>
    <div class="step light" style="background:#E2EAD9">100</div>
    <div></div><div></div>
  </div>
  <div class="row">
    <div class="label">Cream</div>
    <div class="step light" style="background:#FAF4E5">200</div>
    <div class="step light" style="background:#F2E9D6">300</div>
    <div class="step light" style="background:#E3D6B8">500</div>
    <div class="step light" style="background:#C9B98F">700</div>
    <div></div><div></div>
  </div>
  <div class="row">
    <div class="label">Clay</div>
    <div class="step dark" style="background:#934F2E">700</div>
    <div class="step dark" style="background:#BB734A">500</div>
    <div class="step light" style="background:#D9A284">300</div>
    <div class="step light" style="background:#F2DAC8">100</div>
    <div></div><div></div>
  </div>
  <div class="row">
    <div class="label">Ink</div>
    <div class="step dark" style="background:#1B1729">900</div>
    <div class="step dark" style="background:#2F2840">700</div>
    <div class="step dark" style="background:#4B4361">500</div>
    <div class="step light" style="background:#8B83A0">300</div>
    <div></div><div></div>
  </div>
</body></html>
