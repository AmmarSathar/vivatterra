<!doctype html><html><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 26px 32px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; min-width: 96px; }
  .d-xl { font-family: var(--font-sans); font-weight: 400; font-size: 72px; line-height: 1.05; letter-spacing: -0.025em; color: var(--vt-forest); }
  .d-lg { font-family: var(--font-sans); font-weight: 400; font-size: 54px; line-height: 1.05; letter-spacing: -0.025em; color: var(--vt-ink-900); }
  .d   { font-family: var(--font-sans); font-weight: 400; font-size: 40px; line-height: 1.1;  letter-spacing: -0.02em;  color: var(--vt-ink-900); }
</style></head>
<body>
  <div class="card-eyebrow">Display · Lato Regular at large sizes — confident, not delicate</div>
  <div class="stack">
    <div class="row"><span class="meta">display-xl<br>72/R/400</span><span class="d-xl">vivaTTerra</span></div>
    <div class="row"><span class="meta">display-lg<br>54/R/400</span><span class="d-lg">Rooted markets</span></div>
    <div class="row"><span class="meta">display<br>40/R/400</span><span class="d">Where producers steward the land</span></div>
  </div>
</body></html>
